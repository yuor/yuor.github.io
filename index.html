<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#4a2f7a 0%,#1b1446 45%,#0b0822 100%);color:#fff4e0;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px 16px;box-sizing:border-box}
main{max-width:520px}
.gem{width:96px;height:96px;margin:0 auto 20px;border-radius:24px;background:linear-gradient(145deg,#fff1bf,#ffc94a 45%,#e08a12);box-shadow:0 0 60px #ffb84d88,inset 0 -8px 0 #b86a0055;position:relative}
.gem:before,.gem:after{content:"";position:absolute;top:36px;width:14px;height:20px;border-radius:50%;background:#1b1446}
.gem:before{left:28px}.gem:after{right:28px}
h1{font-size:40px;margin:0 0 8px;letter-spacing:.5px}
p{font-size:18px;line-height:1.5;color:#e9dcff;margin:0 0 28px}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{color:#1b1446;background:#ffc94a;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px}
a.alt{background:transparent;color:#ffe49a;border:2px solid #ffc94a88}
footer{margin-top:40px;font-size:13px;color:#a99bd0}
</style>
</head>

<main>
<div class="gem" aria-hidden="true"></div>
